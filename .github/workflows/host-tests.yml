name: Code Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Build unit tests with sanitizers
        run: >
          gcc -std=c11 -Wall -Wextra -Werror
          -O0 -g
          -fsanitize=address,undefined
          -fno-omit-frame-pointer
          -ICore/Inc
          tests/test_task_supervisor.c
          Core/Src/task_supervisor.c
          -o task_supervisor_test
      - name: Build watchdog policy tests with sanitizers
        run: >
          gcc -std=c11 -Wall -Wextra -Werror
          -O0 -g
          -fsanitize=address,undefined
          -fno-omit-frame-pointer
          -ICore/Inc
          tests/test_watchdog_policy.c
          Core/Src/watchdog_policy.c
          -o watchdog_policy_test

      - name: Build watchdog service tests with sanitizers
        run: >
          gcc -std=c11 -Wall -Wextra -Werror
          -O0 -g
          -fsanitize=address,undefined
          -fno-omit-frame-pointer
          -ICore/Inc
          tests/test_watchdog_service.c
          Core/Src/watchdog_service.c
          -o watchdog_service_test

      - name: Run watchdog policy tests with sanitizers
        run: ./watchdog_policy_test

      - name: Run watchdog service tests with sanitizers
        run: ./watchdog_service_test

      - name: Run unit tests with sanitizers
        run: ./task_supervisor_test
  integration-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Build reliability flow test with sanitizers
        run: >
          gcc -std=c11 -Wall -Wextra -Werror
          -O0 -g
          -fsanitize=address,undefined
          -fno-omit-frame-pointer
          -ICore/Inc
          tests/test_reliability_flow.c
          Core/Src/task_supervisor.c
          Core/Src/watchdog_policy.c
          Core/Src/watchdog_service.c
          -o reliability_flow_test

      - name: Run reliability flow test with sanitizers
        run: ./reliability_flow_test

  static-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install Cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Analyze reliability modules
        run: >
          cppcheck
          --enable=warning,style,performance,portability
          --std=c11
          --error-exitcode=1
          --suppress=missingIncludeSystem
          -ICore/Inc
          Core/Src/task_supervisor.c
          Core/Src/watchdog_policy.c
          Core/Src/watchdog_service.c

  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Install gcovr
        run: |
          sudo apt-get update
          sudo apt-get install -y gcovr

      - name: Build coverage test
        run: |
          mkdir -p coverage
          gcc -std=c11 -Wall -Wextra -Werror \
            -O0 -g --coverage -fprofile-abs-path \
            -ICore/Inc \
            tests/test_task_supervisor.c \
            Core/Src/task_supervisor.c \
            -o coverage/task_supervisor_test
          gcc -std=c11 -Wall -Wextra -Werror \
            -O0 -g --coverage -fprofile-abs-path \
            -ICore/Inc \
            tests/test_watchdog_policy.c \
            Core/Src/watchdog_policy.c \
            -o coverage/watchdog_policy_test
          gcc -std=c11 -Wall -Wextra -Werror \
            -O0 -g --coverage -fprofile-abs-path \
            -ICore/Inc \
            tests/test_watchdog_service.c \
            Core/Src/watchdog_service.c \
            -o coverage/watchdog_service_test
      - name: Run coverage tests
        run: |
          ./coverage/task_supervisor_test
          ./coverage/watchdog_policy_test
          ./coverage/watchdog_service_test

      - name: Enforce coverage gate
        run: >
          gcovr
          --root .
          --object-directory coverage
          --filter 'Core/Src/task_supervisor.c'
          --filter 'Core/Src/watchdog_policy.c'
          --filter 'Core/Src/watchdog_service.c'
          --txt
          --print-summary
          --fail-under-line 100
          --fail-under-branch 100
